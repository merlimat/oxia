/**
 * Oxia Coordinator Admin API
 */
syntax = "proto3";

package io.oxia.proto.v1;

option go_package = "github.com/oxia-db/oxia/common/proto";
option java_multiple_files = true;

service OxiaAdmin {

  rpc ListNamespaces(ListNamespacesRequest) returns (ListNamespacesResponse);

  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);

  // SplitShard initiates splitting a shard into two child shards.
  // The parent shard's hash range is split at the midpoint.
  rpc SplitShard(SplitShardRequest) returns (SplitShardResponse);

}

message ListNamespacesRequest {
}

message ListNamespacesResponse {
  repeated string namespaces = 1;
}

message ListNodesRequest {
}

message Node {
  optional string name = 1;
  string public_address = 2;
  string internal_address = 3;
  map<string, string> metadata = 4;
}

message ListNodesResponse {
  repeated Node nodes = 1;
}

message SplitShardRequest {
  string namespace = 1;
  int64 shard = 2;
}

message SplitShardResponse {
  // The ID of the child shard covering the lower hash range [parent.min, midpoint]
  int64 child_shard_low = 1;
  // The ID of the child shard covering the upper hash range [midpoint+1, parent.max]
  int64 child_shard_high = 2;
}